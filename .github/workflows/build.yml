name: build

on:
  pull_request:
    branches: [main, next]
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Add the Nexus-PLM package feed
        run: >
          dotnet nuget add source "https://nuget.pkg.github.com/Nexus-PLM/index.json"
          --name nexus-plm
          --username "${{ github.actor }}"
          --password "${{ secrets.NUGET_READ_TOKEN || secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
      - name: Test the translators (pure .NET, real conversions)
        run: dotnet test Nexus.PLM.PrusaSlicer.Translators.Tests/Nexus.PLM.PrusaSlicer.Translators.Tests.csproj -c Release

  # A v* tag attaches the translators deliverable to the GitHub release: the publish output
  # minus the contract DLL; the .deps.json stays in (the server's resolver is rooted at it).
  release-translators:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Add the Nexus-PLM package feed
        run: >
          dotnet nuget add source "https://nuget.pkg.github.com/Nexus-PLM/index.json"
          --name nexus-plm
          --username "${{ github.actor }}"
          --password "${{ secrets.NUGET_READ_TOKEN || secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
      - name: Publish the translators
        run: dotnet publish Nexus.PLM.PrusaSlicer.Translators/Nexus.PLM.PrusaSlicer.Translators.csproj -c Release -o out
      - name: Assert the output shape, then zip (DLLs + the script manifest in ONE folder)
        run: |
          test ! -f out/Nexus.PLM.Addin.Sdk.Translators.dll
          test -f out/Nexus.PLM.PrusaSlicer.Translators.deps.json
          cp translators/translators.json out/
          (cd out && zip -qr ../Nexus.PLM.PrusaSlicer.Translators.zip .)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --notes "PrusaSlicer add-in release ${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" Nexus.PLM.PrusaSlicer.Translators.zip --clobber
